name: Compilar APK

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Buscar carpeta del proyecto
        id: find_dir
        run: |
          if [ -d "androide" ]; then
            echo "dir=androide" >> $GITHUB_OUTPUT
          elif [ -d "android" ]; then
            echo "dir=android" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Dar permisos a Gradle Wrapper
        run: |
          cd ${{ steps.find_dir.outputs.dir }}
          chmod +x gradlew || true

      - name: Compilar APK
        run: |
          cd ${{ steps.find_dir.outputs.dir }}
          ./gradlew assembleDebug

      - name: Guardar APK resultante
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find_dir.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
